name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:package

  credential-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/keyring-smoke.test.js
        env:
          CODEHUB_KEYRING_SMOKE: '1'

  credential-smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Secret Service test runtime
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Test native Secret Service adapter
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf %s test-password | gnome-keyring-daemon --unlock --components=secrets)"
            CODEHUB_KEYRING_SMOKE=1 node --test test/keyring-smoke.test.js
          '
